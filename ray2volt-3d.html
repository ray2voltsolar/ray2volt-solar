<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ray2Volt 3D has its own site at 3d.ray2voltsolar.com. GitHub Pages has no
         server redirects, so this page forwards visitors and old links. -->
    <!-- Theme before first paint: the visitor's own choice, else light -->
    <script>
        (function () {
            var theme = 'light';
            try {
                var saved = localStorage.getItem('r2v-theme');
                if (saved === 'light' || saved === 'dark') theme = saved;
            } catch (e) {}
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script>
        location.replace('https://3d.ray2voltsolar.com/' + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://3d.ray2voltsolar.com/">
    <meta name="robots" content="noindex, follow">
    <title>Ray2Volt 3D: 3D Plant Viewers for Solar EPCs | Ray2Volt Solar</title>
    <link rel="canonical" href="https://3d.ray2voltsolar.com/">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <main id="main" class="section">
        <div class="container">
            <p>Ray2Volt 3D has its own site. <a class="text-link" href="https://3d.ray2voltsolar.com/">Go to 3d.ray2voltsolar.com</a>.</p>
        </div>
    </main>
</body>

</html>

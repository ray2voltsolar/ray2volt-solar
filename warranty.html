<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Warranty and claims moved to raycare.html. GitHub Pages has no server
         redirects, so this page forwards visitors and old links. -->
    <!-- Theme before first paint: the visitor's own choice, else light -->
    <script>
        (function () {
            var theme = 'light';
            try {
                var saved = localStorage.getItem('r2v-theme');
                if (saved === 'light' || saved === 'dark') theme = saved;
            } catch (e) {}
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script>
        location.replace('raycare.html' + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=raycare.html">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="theme.css">
</head>
